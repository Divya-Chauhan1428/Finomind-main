<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinoMind — Services Radial Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#00AEEF;
    --teal:#007B9E;
    --dark-teal:#1A5276;
    --cloud-cyan:#E0F7FC;
    --off-white:#F7FAFB;
    --charcoal:#2C3E50;
    --slate:#4A6274;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter',sans-serif;
    background:#FFFFFF;
  }

  .services-hub-section{
    position:relative;
    width:100%;
    min-height:100vh;
    background:#FFFFFF;
    overflow:hidden;
    padding:80px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hub-header{
    text-align:center;
    margin-bottom:48px;
    position:relative;
    z-index:2;
  }

  .hub-eyebrow{
    font-family:'Inter',sans-serif;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:600;
    margin-bottom:14px;
  }

  .hub-title{
    font-family:'Playfair Display',serif;
    font-size:clamp(28px,4vw,42px);
    color:var(--dark-teal);
    font-weight:700;
  }

  .hub-title span{color:var(--cyan);}

  .hub-wrapper{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:60px;
    width:100%;
    max-width:1240px;
    flex-wrap:wrap;
  }

  /* ---------- RADIAL WHEEL ---------- */
  .radial-wheel{
    position:relative;
    width:620px;
    height:620px;
    flex-shrink:0;
  }

  .spokes-svg{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .spoke-line{
    stroke:rgba(0,123,158,0.32);
    stroke-width:2;
    stroke-dasharray:3 9;
    stroke-linecap:round;
    marker-end:url(#arrowHead);
    transition:stroke 0.4s ease, stroke-width 0.4s ease;
  }

  .spoke-line.active{
    stroke:var(--cyan);
    stroke-width:2.5;
    marker-end:url(#arrowHeadActive);
  }

  .hub-center{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3;
    animation:breathe 4.5s ease-in-out infinite;
  }

  .hub-center img{
    width:100%;
    height:auto;
    filter:drop-shadow(0 8px 22px rgba(26,82,118,0.22));
  }

  @keyframes breathe{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.025);}
  }

  @keyframes nodeIn{
    from{opacity:0; transform:translate(-50%,-50%) scale(0.6);}
    to{opacity:1; transform:translate(-50%,-50%) scale(1);}
  }

  .service-node{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    z-index:4;
  }

  .service-node img{
    width:72px;
    height:72px;
    object-fit:contain;
    filter:drop-shadow(0 4px 10px rgba(44,62,80,0.18));
    transition:transform 0.35s ease, filter 0.35s ease;
  }

  .service-node .node-label{
    margin-top:10px;
    font-size:12px;
    font-weight:600;
    color:var(--slate);
    background:var(--cloud-cyan);
    padding:4px 12px;
    border-radius:12px;
    white-space:nowrap;
    opacity:0.85;
    transition:opacity 0.3s ease, background 0.3s ease, color 0.3s ease;
    pointer-events:none;
  }

  .service-node:hover img{transform:scale(1.08);}

  .service-node.active img{
    transform:scale(1.18);
    filter:drop-shadow(0 0 22px rgba(0,174,239,0.65));
  }

  .service-node.active .node-label{
    opacity:1;
    background:var(--cyan);
    color:#FFFFFF;
  }

  .service-node:focus-visible{
    outline:none;
  }

  .service-node:focus-visible img{
    transform:scale(1.1);
    filter:drop-shadow(0 0 0 4px rgba(0,174,239,0.35)) drop-shadow(0 4px 10px rgba(44,62,80,0.18));
  }

  /* ---------- SIDE PANEL ---------- */
  .hub-panel{
    position:relative;
    width:100%;
    max-width:420px;
    min-height:300px;
    background:#FFFFFF;
    border:1px solid rgba(0,123,158,0.18);
    border-radius:18px;
    padding:40px 36px;
    box-shadow:0 24px 48px rgba(26,82,118,0.08);
  }

  .panel-index{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:2px;
    color:var(--teal);
    font-weight:600;
    margin-bottom:18px;
    display:block;
  }

  .panel-title-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }

  .panel-badge{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:9px;
    background:var(--cloud-cyan);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--teal);
  }

  .panel-badge svg{
    width:19px;
    height:19px;
  }

  .panel-body{
    transition:opacity 0.25s ease, transform 0.25s ease;
  }

  .panel-title{
    font-family:'Playfair Display',serif;
    font-size:28px;
    color:var(--dark-teal);
    font-weight:700;
    margin-bottom:0;
    min-height:38px;
  }

  .panel-desc{
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.7;
    color:var(--slate);
    min-height:96px;
  }

  .panel-content-fade{
    opacity:0;
    transform:translateY(4px);
  }

  .panel-cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:22px;
    padding:12px 24px;
    background:var(--dark-teal);
    color:#FFFFFF;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    border-radius:999px;
    transition:background 0.3s ease, gap 0.3s ease, transform 0.2s ease;
  }

  .panel-cta:hover{
    background:var(--cyan);
    gap:12px;
  }

  .panel-cta:active{transform:scale(0.97);}

  .panel-cta:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
  }

  .panel-cta-arrow{
    transition:transform 0.3s ease;
  }

  .panel-cta:hover .panel-cta-arrow{transform:translateX(2px);}

  .panel-progress{
    display:flex;
    gap:8px;
    margin-top:32px;
  }

  .progress-dot{
    height:4px;
    flex:1;
    border-radius:2px;
    background:rgba(0,174,239,0.15);
    overflow:hidden;
    position:relative;
  }

  .progress-dot .fill{
    position:absolute;
    top:0;left:0;
    height:100%;
    width:0%;
    background:var(--cyan);
  }

  .progress-dot.done .fill{width:100%;transition:none;}
  .progress-dot.filling .fill{width:100%;transition:width linear;}

  @media (max-width:900px){
    .radial-wheel{width:420px;height:420px;}
    .hub-center{width:130px;}
    .service-node img{width:52px;height:52px;}
    .service-node .node-label{font-size:10px;padding:3px 9px;}
  }

  @media (max-width:640px){
    .radial-wheel{width:320px;height:320px;}
    .hub-center{width:100px;}
    .service-node img{width:40px;height:40px;}
    .hub-panel{padding:28px 24px;}
    .panel-title{font-size:22px;}
  }

  @media (prefers-reduced-motion: reduce){
    .service-node img, .spoke-line, .progress-dot .fill, .panel-body{transition:none !important;}
    .hub-center, .service-node{animation:none !important;}
  }
</style>
</head>

const wheel = document.getElementById('radialWheel');
const svg = document.getElementById('spokesSvg');
const panelIndex = document.getElementById('panelIndex');
const panelBody = document.getElementById('panelBody');
const panelBadge = document.getElementById('panelBadge');
const panelTitle = document.getElementById('panelTitle');
const panelDesc = document.getElementById('panelDesc');
const panelCta = document.getElementById('panelCta');
const panelProgress = document.getElementById('panelProgress');

const CENTER = 310;
const RADIUS = 250;
const N = services.length;
const INNER_GAP = 125; /* space cleared around the logo */
const OUTER_GAP = 85;  /* space cleared before reaching each icon */

let nodes = [];
let spokeLines = [];
let activeIndex = 0;
let autoTimer = null;
let progressTimer = null;
const AUTO_INTERVAL = 4000;

function buildWheel(){
  services.forEach((service, i) => {
    const angle = (-90 + (360 / N) * i) * (Math.PI / 180);
    let x = CENTER + RADIUS * Math.cos(angle);
    let y = CENTER + RADIUS * Math.sin(angle);
    
    // Shift specific nodes to prevent collision
    if (i === 1) { // Continental Bridge (right side)
      x += 25;
    } else if (i === 5) { // Wealth Concierge (left side)
      x -= 25;
    }

    const dx = x - CENTER, dy = y - CENTER;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const ux = dx / dist, uy = dy / dist;

    const startX = CENTER + ux * INNER_GAP;
    const startY = CENTER + uy * INNER_GAP;
    
    // Adjust outer gap for shifted nodes to keep arrows clear of labels
    let outerGap = OUTER_GAP;
    if (i === 1 || i === 5) {
      outerGap = 110;
    }
    const endX = x - ux * outerGap;
    const endY = y - uy * outerGap;

    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', startX);
    line.setAttribute('y1', startY);
    line.setAttribute('x2', endX);
    line.setAttribute('y2', endY);
    line.setAttribute('class','spoke-line');
    line.setAttribute('marker-end','url(#arrowHead)');
    svg.appendChild(line);
    spokeLines.push(line);

    const node = document.createElement('div');
    node.className = 'service-node';
    node.style.left = x + 'px';
    node.style.top = y + 'px';
    node.style.transform = 'translate(-50%, -50%)';
    node.style.animation = `nodeIn 0.5s ease ${0.15 + i * 0.08}s backwards`;
    node.setAttribute('tabindex', '0');
    node.setAttribute('role', 'button');
    node.setAttribute('aria-label', `Show ${service.title} details`);
    node.innerHTML = `<img src="${service.icon}" alt="${service.title} icon"><span class="node-label">${service.title}</span>`;
    node.addEventListener('click', () => selectService(i, true));
    node.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        selectService(i, true);
      }
    });
    wheel.appendChild(node);
    nodes.push(node);
  });

  services.forEach(() => {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.innerHTML = '<span class="fill"></span>';
    panelProgress.appendChild(dot);
  });
}

function addArrowMarker(){
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#007B9E" fill-opacity="0.55"></path>
    </marker>
    <marker id="arrowHeadActive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00AEEF"></path>
    </marker>`;
  svg.appendChild(defs);
}

function selectService(index, isManual, instant){
  activeIndex = index;
  const service = services[index];

  nodes.forEach((n, i) => n.classList.toggle('active', i === index));
  spokeLines.forEach((l, i) => l.classList.toggle('active', i === index));

  const applyContent = () => {
    panelIndex.textContent = String(index + 1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
    panelBadge.innerHTML = service.badge;
    panelTitle.textContent = service.title;
    panelDesc.textContent = service.desc;
    panelCta.href = `service-detail.html?service=${service.anchor}`;
    panelCta.setAttribute('aria-label', `Know more about ${service.title}`);
    panelBody.classList.remove('panel-content-fade');
  };

  if(instant){
    applyContent();
  } else {
    panelBody.classList.add('panel-content-fade');
    setTimeout(applyContent, 180);
  }

  resetProgressDots(index);

  if(isManual){
    restartAuto();
  }
}

function resetProgressDots(index){
  const dots = panelProgress.querySelectorAll('.progress-dot');
  dots.forEach((dot, i) => {
    const fill = dot.querySelector('.fill');
    dot.classList.remove('filling');
    fill.style.transition = 'none';
    if(i < index){
      dot.classList.add('done');
      fill.style.width = '100%';
    } else {
      dot.classList.remove('done');
      fill.style.width = '0%';
    }
  });

  clearTimeout(progressTimer);
  requestAnimationFrame(() => {
    const activeDot = dots[index];
    const activeFill = activeDot.querySelector('.fill');
    activeDot.classList.add('filling');
    activeFill.style.transition = `width ${AUTO_INTERVAL}ms linear`;
    requestAnimationFrame(() => { activeFill.style.width = '100%'; });
  });
}

function nextService(){
  const next = (activeIndex + 1) % N;
  selectService(next, false);
}

function startAuto(){
  autoTimer = setInterval(nextService, AUTO_INTERVAL);
}

function restartAuto(){
  clearInterval(autoTimer);
  startAuto();
}

addArrowMarker();
buildWheel();
selectService(0, false, true);
startAuto();
</script>
